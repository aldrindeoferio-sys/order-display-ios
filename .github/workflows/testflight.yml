name: TestFlight Archive

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project OrderDisplay.xcodeproj -scheme OrderDisplay

      - name: Verify TestFlight secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          test -n "$IOS_DISTRIBUTION_CERTIFICATE" || { echo "::error::Missing IOS_DISTRIBUTION_CERTIFICATE"; exit 1; }
          test -n "$IOS_DISTRIBUTION_PASSWORD" || { echo "::error::Missing IOS_DISTRIBUTION_PASSWORD"; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE" || { echo "::error::Missing IOS_PROVISIONING_PROFILE"; exit 1; }
          echo "Signing secrets are configured."

      - name: Install signing certificate and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          # Decode with Python for consistent behavior on GitHub macOS runners.
          python3 - <<'PY'
          import base64, os, pathlib, sys
          items = [
              ("IOS_DISTRIBUTION_CERTIFICATE", pathlib.Path(os.environ["RUNNER_TEMP"]) / "distribution.p12"),
              ("IOS_PROVISIONING_PROFILE", pathlib.Path(os.environ["RUNNER_TEMP"]) / "profile.mobileprovision"),
          ]
          for name, path in items:
              try:
                  path.write_bytes(base64.b64decode(os.environ[name], validate=True))
              except Exception as exc:
                  print(f"::error::{name} is not valid Base64: {exc}")
                  sys.exit(1)
              if path.stat().st_size == 0:
                  print(f"::error::{name} decoded to an empty file")
                  sys.exit(1)
              print(f"{name} decoded successfully ({path.stat().st_size} bytes).")
          PY

          # Validate the P12 and its password without printing either secret.
          if ! openssl pkcs12 -in "$CERT_PATH" -passin env:IOS_DISTRIBUTION_PASSWORD -noout >/dev/null 2>&1; then
            echo "::error::The distribution .p12 could not be opened. IOS_DISTRIBUTION_PASSWORD may not match MYIEM_Distribution.p12, or the P12 is invalid."
            exit 1
          fi
          echo "Distribution P12 and password validated."

          # Validate the Apple provisioning profile before installing it.
          if ! security cms -D -i "$PROFILE_PATH" >/dev/null 2>&1; then
            echo "::error::IOS_PROVISIONING_PROFILE is not a valid Apple mobileprovision file."
            exit 1
          fi
          echo "Provisioning profile validated."

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if ! security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "::error::Apple Distribution certificate import failed."
            exit 1
          fi
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "Signing certificate and provisioning profile installed."

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild             -project OrderDisplay.xcodeproj             -scheme OrderDisplay             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/OrderDisplay.xcarchive"             archive 2>&1 | tee archive.log

      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-archive-log
          path: archive.log
          retention-days: 7
