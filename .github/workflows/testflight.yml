name: TestFlight Archive

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project OrderDisplay.xcodeproj -scheme OrderDisplay

      - name: Verify TestFlight secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          test -n "$IOS_DISTRIBUTION_CERTIFICATE" || { echo "::error::Missing IOS_DISTRIBUTION_CERTIFICATE"; exit 1; }
          test -n "$IOS_DISTRIBUTION_PASSWORD" || { echo "::error::Missing IOS_DISTRIBUTION_PASSWORD"; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE" || { echo "::error::Missing IOS_PROVISIONING_PROFILE"; exit 1; }
          echo "Signing secrets are configured."

      - name: Install signing certificate and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          # Decode with Python for consistent behavior on GitHub macOS runners.
          python3 - <<'PY'
          import base64, os, pathlib, sys
          items = [
              ("IOS_DISTRIBUTION_CERTIFICATE", pathlib.Path(os.environ["RUNNER_TEMP"]) / "distribution.p12"),
              ("IOS_PROVISIONING_PROFILE", pathlib.Path(os.environ["RUNNER_TEMP"]) / "profile.mobileprovision"),
          ]
          for name, path in items:
              try:
                  path.write_bytes(base64.b64decode(os.environ[name], validate=True))
              except Exception as exc:
                  print(f"::error::{name} is not valid Base64: {exc}")
                  sys.exit(1)
              if path.stat().st_size == 0:
                  print(f"::error::{name} decoded to an empty file")
                  sys.exit(1)
              print(f"{name} decoded successfully ({path.stat().st_size} bytes).")
          PY

          # Do not pre-validate the P12 with OpenSSL. Older Apple-exported
          # PKCS#12 files can use legacy algorithms that OpenSSL 3 rejects even
          # when the password and certificate are valid. macOS Security is the
          # authoritative importer used below.
          echo "Distribution P12 decoded; validating by importing into the macOS keychain."

          # Validate the Apple provisioning profile before installing it.
          if ! security cms -D -i "$PROFILE_PATH" >/dev/null 2>&1; then
            echo "::error::IOS_PROVISIONING_PROFILE is not a valid Apple mobileprovision file."
            exit 1
          fi
          echo "Provisioning profile validated."

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if ! security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "::error::Apple Distribution certificate import failed."
            exit 1
          fi
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")

          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "Signing certificate and provisioning profile installed."
          echo "Provisioning profile: $PROFILE_NAME"
          echo "Development team: $TEAM_ID"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project OrderDisplay.xcodeproj \
            -scheme OrderDisplay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OrderDisplay.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive 2>&1 | tee archive.log

      - name: Export TestFlight Internal Only IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.deoferioapps.orderdisplay</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>testFlightInternalTestingOnly</key>
            <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/OrderDisplay.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee export.log

          test -f "$RUNNER_TEMP/TestFlightExport/Order Display.ipa" || {
            echo "::error::Order Display.ipa was not produced."
            find "$RUNNER_TEMP/TestFlightExport" -maxdepth 2 -type f -print || true
            exit 1
          }

      - name: Save TestFlight IPA
        uses: actions/upload-artifact@v4
        with:
          name: order-display-v0.1.6-testflight-internal
          path: ${{ runner.temp }}/TestFlightExport/Order Display.ipa
          retention-days: 7

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/TestFlightExport/Order Display.ipa
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          backend: altool
          wait-for-processing: 'false'

      - name: Upload archive/export logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-archive-log
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 7
