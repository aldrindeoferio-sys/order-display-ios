name: iOS Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project OrderDisplay.xcodeproj -scheme OrderDisplay

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project OrderDisplay.xcodeproj \
            -scheme OrderDisplay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Surface compiler errors
        if: failure()
        run: |
          echo "=== XCODE COMPILER ERRORS ==="
          ERRORS=$(grep -E "error:|fatal error:" build.log | tail -100 || true)\n          printf "%s\\n" "$ERRORS" > compiler-errors.txt\n          echo "$ERRORS"\n          {\n            echo "## Xcode compiler errors"\n            echo '```'\n            echo "$ERRORS"\n            echo '```'\n          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          retention-days: 7
