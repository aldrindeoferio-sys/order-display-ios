name: OrderDisplay
options:
  bundleIdPrefix: com.deoferioapps
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  OrderDisplay:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - OrderDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deoferioapps.orderdisplay
        PRODUCT_NAME: Order Display
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: OrderDisplay/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: OrderDisplay/Info.plist
      properties:
        CFBundleDisplayName: Order Display
        NSLocalNetworkUsageDescription: Order Display connects to your restaurant's local Order Display server and customer display.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
