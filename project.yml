name: OrderDisplay
options:
  bundleIdPrefix: com.deoferioapps
settings:
  base:
    SWIFT_VERSION: 5.0
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
targets:
  OrderDisplay:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - OrderDisplay
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deoferioapps.orderdisplay
        PRODUCT_NAME: Order Display
        MARKETING_VERSION: 0.1.6
        CURRENT_PROJECT_VERSION: 6
        INFOPLIST_FILE: OrderDisplay/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: OrderDisplay/Info.plist
      properties:
        CFBundleDisplayName: Order Display
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Order Display connects to your restaurant's local Order Display server and customer display.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GADApplicationIdentifier: ca-app-pub-2593622446351585~9721410448
