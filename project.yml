name: OrderDisplay
options:
  bundleIdPrefix: com.deoferioapps
settings:
  base:
    SWIFT_VERSION: 5.0
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk.git
    from: 4.8.6
targets:
  OrderDisplay:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - OrderDisplay
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleCast
        product: GoogleCastDynamic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deoferioapps.orderdisplay
        PRODUCT_NAME: Order Display
        MARKETING_VERSION: 0.1.6
        CURRENT_PROJECT_VERSION: 15
        INFOPLIST_FILE: OrderDisplay/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: LG9KF54FLF
        PROVISIONING_PROFILE_SPECIFIER: Order Display App Store
        CODE_SIGN_IDENTITY: Apple Distribution
    info:
      path: OrderDisplay/Info.plist
      properties:
        CFBundleDisplayName: Order Display
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Order Display uses your local network to discover Chromecast and Google Cast compatible TVs.
        NSBonjourServices:
          - _googlecast._tcp
          - _C8B27B87._googlecast._tcp
        OrderDisplayCastReceiverAppID: C8B27B87
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GADApplicationIdentifier: ca-app-pub-2593622446351585~9721410448
